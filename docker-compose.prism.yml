# Docker Compose v2.20+; use the overlay instead if CPA is already deployed.
services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/power12317/cliproxyapi:v2026.10.10-3}
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - type: bind
        source: ${CLI_PROXY_CONFIG_PATH:-./config.yaml}
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped

  prism-adapter:
    image: ${PRISM_ADAPTER_IMAGE:-ghcr.io/power12317/prism-adapter:v2026.10.10-1}
    network_mode: "service:cli-proxy-api"
    init: true
    depends_on:
      cli-proxy-api:
        condition: service_started
        restart: true
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    shm_size: 1gb
    volumes:
      - ./prism-data:/var/lib/cliproxy-prism
    restart: unless-stopped
